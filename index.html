<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>紫米芽和六角星的港湾</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://npm.elemecdn.com/lxgw-wenkai-screen-webfont/style.css" media="print" onload="this.media='all'">
</head>
<body class="login-body">
  <div class="login-page">
    <div class="floating-hearts" id="floatingHearts"></div>

    <div class="deco-dot" style="width:200px;height:200px;background:var(--primary-light);top:-60px;left:-60px;"></div>
    <div class="deco-dot" style="width:150px;height:150px;background:var(--accent);bottom:-40px;right:-40px;"></div>
    <div class="deco-dot" style="width:100px;height:100px;background:var(--primary-light);top:30%;right:8%;"></div>

    <div class="login-card" id="loginCard">
      <div class="login-heart">&#10084;&#65039;</div>
      <h1 class="login-title">六角星和紫米芽的小港湾</h1>
      <p class="login-subtitle" id="loginSubtitle">输入密码，回到属于我们的小世界</p>
      <form class="login-form" id="loginForm" autocomplete="off">
        <input
          type="password"
          class="input-field"
          id="passwordInput"
          placeholder="&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;"
          maxlength="20"
          autofocus
        >
        <button type="submit" class="btn btn-primary" id="submitBtn">
          进入港湾
        </button>
        <div class="login-error" id="loginError"></div>
      </form>
      <p class="login-hint" id="loginHint"></p>
    </div>
  </div>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
