name = "our-garden"
compatibility_date = "2024-09-01"
pages_build_output_dir = "."

[[d1_databases]]
binding = "DB"
database_name = "our-garden-db"
database_id = "<用实际ID替换>"

[[r2_buckets]]
binding = "R2"
bucket_name = "our-garden-photos"

# AUTH_PASSWORD 请在 Cloudflare Pages 面板 Settings > Environment variables 中设置
# 不要写在此文件中
