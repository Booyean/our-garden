<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>时光日记 - 紫米芽和六角星的港湾</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://npm.elemecdn.com/lxgw-wenkai-screen-webfont/style.css" media="print" onload="this.media='all'">
</head>
<body>
  <div class="toast" id="toast"></div>

  <div class="author-overlay" id="authorOverlay">
    <div class="author-modal card">
      <p class="author-modal-title">你是谁呀？</p>
      <p class="author-modal-sub">选一个属于你的头像</p>
      <div class="author-choices">
        <button class="author-btn" data-author="&#x1F52F;">&#x1F52F;</button>
        <button class="author-btn" data-author="&#x1F411;">&#x1F411;</button>
      </div>
    </div>
  </div>

  <div class="page-container">
    <div class="page-header">
      <h1>时光日记</h1>
      <p>记录属于我们的每一天</p>
    </div>

    <div class="calendar card">
      <div class="cal-nav">
        <button class="cal-arrow" id="prevMonth">&#8249;</button>
        <span class="cal-title" id="calTitle"></span>
        <button class="cal-arrow" id="nextMonth">&#8250;</button>
      </div>
      <div class="cal-weekdays">
        <span>日</span><span>一</span><span>二</span><span>三</span>
        <span>四</span><span>五</span><span>六</span>
      </div>
      <div class="cal-grid" id="calGrid"></div>
    </div>

    <div class="diary-section" id="diarySection" style="display:none;">
      <div class="diary-card card" id="diaryCard">
        <div class="diary-card-top">
          <div class="diary-meta">
            <span class="diary-date-label" id="diaryDateLabel"></span>
            <span class="diary-author-badge" id="diaryAuthorBadge"></span>
          </div>
        </div>

        <div class="mood-bar">
          <span class="mood-label">今天的心情</span>
          <div class="mood-list" id="moodList">
            <button class="mood-item" data-mood="&#x1F60A;" data-color="#FFD700">&#x1F60A;<small>开心</small></button>
            <button class="mood-item" data-mood="&#x1F97A;" data-color="#87CEEB">&#x1F97A;<small>想念</small></button>
            <button class="mood-item" data-mood="&#x1F622;" data-color="#B0C4DE">&#x1F622;<small>委屈</small></button>
            <button class="mood-item" data-mood="&#x1F60D;" data-color="#FF69B4">&#x1F60D;<small>期待</small></button>
            <button class="mood-item" data-mood="&#x1F970;" data-color="#FF9BB5">&#x1F970;<small>幸福</small></button>
            <button class="mood-item" data-mood="&#x1F614;" data-color="#A9A9A9">&#x1F614;<small>难过</small></button>
          </div>
        </div>

        <textarea
          class="diary-textarea"
          id="diaryContent"
          placeholder="&#9999;&#65039; 写点什么吧..."
          rows="6"
        ></textarea>

        <div class="diary-actions">
          <button class="btn btn-primary" id="saveBtn">保存日记 &#128149;</button>
        </div>
      </div>
    </div>
  </div>

  <nav class="bottom-nav">
    <div class="nav-inner">
      <a href="diary.html" class="nav-tab active">
        <span class="nav-icon">&#128214;</span>
        <span class="nav-label">日记</span>
      </a>
      <a href="photos.html" class="nav-tab">
        <span class="nav-icon">&#128248;</span>
        <span class="nav-label">相册</span>
      </a>
      <a href="wishes.html" class="nav-tab">
        <span class="nav-icon">&#127919;</span>
        <span class="nav-label">愿望</span>
      </a>
    </div>
  </nav>

  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <script src="js/music-player.js"></script>
  <script src="js/bg-switcher.js"></script>
  <script src="js/diary.js"></script>
  <script>MusicPlayer.init(APP_CONFIG.MUSIC.playlist);</script>
</body>
</html>
