<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>愿望清单 - 紫米芽和六角星的港湾</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://npm.elemecdn.com/lxgw-wenkai-screen-webfont/style.css" media="print" onload="this.media='all'">
</head>
<body>
  <div class="toast" id="toast"></div>
  <div class="confetti-zone" id="confettiZone"></div>

  <div class="page-container">
    <div class="page-header">
      <h1>愿望清单</h1>
      <p>把想一起做的事都写下来</p>
    </div>

    <div class="wish-stats card" id="wishStats">
      <span class="wish-stats-text">已完成 <strong id="statsDone">0</strong> / <strong id="statsTotal">0</strong> 个愿望 &#10024;</span>
    </div>

    <div class="wish-tabs">
      <button class="wish-tab active" data-tab="pending">&#9200; 待完成</button>
      <button class="wish-tab" data-tab="done">&#9989; 已完成</button>
    </div>

    <div class="wish-list" id="wishList"></div>

    <div class="wish-empty" id="wishEmpty" style="display:none;">
      <span class="wish-empty-icon">&#127775;</span>
      <p>还没有愿望哦～写下你们想一起做的事吧！</p>
    </div>

    <div class="wish-add-bar">
      <textarea class="wish-add-input" id="wishInput" placeholder="写下新的愿望..." rows="1" maxlength="200"></textarea>
      <div class="wish-add-row">
        <div class="wish-who-select" id="wishWhoSelect">
          <button class="wish-who-btn selected" data-who="&#x1F52F;">&#x1F52F;</button>
          <button class="wish-who-btn" data-who="&#x1F411;">&#x1F411;</button>
        </div>
        <button class="btn btn-primary" id="wishAddBtn">添加</button>
      </div>
    </div>
  </div>

  <nav class="bottom-nav">
    <div class="nav-inner">
      <a href="diary.html" class="nav-tab">
        <span class="nav-icon">&#128214;</span>
        <span class="nav-label">日记</span>
      </a>
      <a href="photos.html" class="nav-tab">
        <span class="nav-icon">&#128248;</span>
        <span class="nav-label">相册</span>
      </a>
      <a href="wishes.html" class="nav-tab active">
        <span class="nav-icon">&#127919;</span>
        <span class="nav-label">愿望</span>
      </a>
    </div>
  </nav>

  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <script src="js/music-player.js"></script>
  <script src="js/bg-switcher.js"></script>
  <script src="js/wishes.js"></script>
  <script>MusicPlayer.init(APP_CONFIG.MUSIC.playlist);</script>
</body>
</html>
